sonar.organization=overnightworks
sonar.projectKey=overnightworks_agents
# `sonar.sources` is an allowlist, so code this repository runs but does not
# name here is code no rule can fire on, in either direction, while the
# project still reports zero findings.
#
# `.github` is named whole rather than the workflows beneath it: everything under
# it runs with this repository's credentials, so a composite action added later is
# analysed without another change here.
sonar.sources=.github
