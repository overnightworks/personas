name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: The release as YYYY.MM.DD.N, without a v
        type: string
        required: true

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    name: Gate
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    uses: overnightworks/quality/.github/workflows/release-gate.yml@95ceb40c3c9b547c41ef2080df446bfa61bf42f0 # v0.25.0
    with:
      version: ${{ inputs.version }}
      form: YYYY.MM.DD.N

  image:
    name: Image
    needs: gate
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: overnightworks/quality/.github/workflows/image.yml@95ceb40c3c9b547c41ef2080df446bfa61bf42f0 # v0.25.0
    with:
      context: .
      file: Dockerfile
      version: ${{ inputs.version }}
      push: true

  figures:
    name: Figures
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ inputs.version }}
      COMMIT: ${{ needs.gate.outputs.commit }}
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - name: Check out the dispatch's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The configuration lines compare with the newest tag the commit reaches.
          fetch-depth: 0

      - name: Refuse unless the checkout is the commit the gate judged
        run: |
          head=$(git rev-parse HEAD)
          if [ "$head" != "$COMMIT" ]; then
            echo "Refused: the checkout is $head, not the gated commit $COMMIT." >&2
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"

      # As in CI: only what the lockfile resolved, wheels only except the
      # overnightworks libraries, and no development tools.
      - name: Install dependencies
        run: uv sync --locked --no-install-project --no-build --no-dev

      - name: Write the notes' configuration, figure and room lines from the files the release carries
        id: notes
        run: |
          {
            scripts/configuration_release_notes.sh "$VERSION"
            echo
            scripts/figure_release_notes.sh "$VERSION"
          } > release-notes.md
          # A random delimiter cannot occur in the notes.
          delimiter="notes_$(openssl rand -hex 16)"
          {
            echo "notes<<${delimiter}"
            cat release-notes.md
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: Gather the figure and room files
        run: |
          mkdir release-figures
          cp src/characters/*.vrm src/characters/*.room.glb release-figures/

      - name: Upload the figure and room files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: figures
          path: release-figures/
          if-no-files-found: error
          retention-days: 1

  tag:
    name: Tag
    needs: [gate, image, figures]
    permissions:
      contents: write
    uses: overnightworks/quality/.github/workflows/release-tag.yml@95ceb40c3c9b547c41ef2080df446bfa61bf42f0 # v0.25.0
    with:
      version: ${{ inputs.version }}
      commit: ${{ needs.gate.outputs.commit }}
      artifact: figures
      notes: ${{ needs.figures.outputs.notes }}
