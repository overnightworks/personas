name: CodeQL

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  # A superseded pull-request run is cancelled; a run on main or the schedule
  # never is, because the release waits for main's run to finish.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    permissions:
      security-events: write
      contents: read
      actions: read
    uses: overnightworks/quality/.github/workflows/codeql.yml@0cff5e74b3a9b106490723264468271a23d5579d # v0.24.0
    with:
      languages: '["actions", "python"]'
