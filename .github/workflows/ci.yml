name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  # A superseded pull-request run is cancelled; a run on main never is,
  # because the release waits for main's run to finish.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    name: Documents
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Offline: only relative links and anchors in the tracked Markdown are
      # judged, so a dead external site never fails a pull request.
      - name: Check links and anchors
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          fail: true
          args: --offline --include-fragments --no-progress --verbose './**/*.md'

  ci:
    name: Lint and test
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"

      # This is the only step that installs, and it installs only what the
      # lockfile resolved: --locked refuses a stale lock instead of resolving
      # fresh versions. Only one build is allowed, the git-pinned
      # overnightworks library named in pyproject.toml (tool.uv), run with
      # exact build tools; --no-build refuses every other source distribution,
      # whose build script would run third-party code on the runner, so third-party
      # packages are wheel-only. personas itself stays out of the environment: nothing
      # below needs it installed, because pytest puts src/ on the import path
      # (pyproject.toml, tool.pytest.ini_options.pythonpath). The steps below then
      # call their tool straight from that environment instead of installing again.
      - name: Install dependencies
        run: |
          uv sync --locked --no-install-project --no-build
          echo "${PWD}/.venv/bin" >> "${GITHUB_PATH}"

      - name: Lint
        run: |
          ruff check .
          ruff format --check src tests
          pyright

      - name: Find dead code
        run: vulture

      # Which files are measured is pyproject.toml's to say (the source key
      # under [tool.coverage.run]). The xml is the report the quality gate's
      # scan reads. The workers' coverage data is combined by pytest-cov. No -q:
      # it hides the header line that prints pytest-randomly's seed.
      - name: Test with coverage
        run: pytest -n auto --cov-report=xml

      - name: Upload the coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 1

  image:
    name: Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image without pushing it
        run: docker build --tag personas-image .

      # The image holds no configuration, so the runner stops at start with the variable named.
      - name: Check that the runner refuses to start without a configuration
        run: |
          if docker run --rm personas-image 2>stderr.txt; then exit 1; fi
          grep PERSONAS_CONFIG stderr.txt

      # The runner is PID 1 here, which ignores a signal it has no handler for. Its token endpoint refuses
      # connections, so its loop backs off and the stop reaches it mid-loop.
      - name: Check that a container stop ends the runner with exit code 0 before the timeout
        run: |
          configuration="$(mktemp --directory)"
          chmod 755 "$configuration"
          openssl rand -hex 16 > "$configuration/runner.secret"
          chmod 644 "$configuration/runner.secret"
          cat > "$configuration/personas.toml" <<'EOF'
          token_endpoint = "http://127.0.0.1:9/token"
          ready_file = "/tmp/ready"
          [[apps]]
          mcp_url = "http://127.0.0.1:9/mcp"
          scope = "mcp-app"
          [[agents]]
          client_id = "agent-runner"
          secret_file = "/configuration/runner.secret"
          EOF
          docker run --detach --name stopped-runner \
            --volume "$configuration:/configuration:ro" \
            --env PERSONAS_CONFIG=/configuration/personas.toml personas-image
          until docker logs stopped-runner 2>&1 | grep --quiet backoff; do
            test "$(docker inspect --format '{{.State.Running}}' stopped-runner)" = true
            sleep 1
          done
          started="$(date +%s)"
          docker stop --time 10 stopped-runner
          test "$(docker inspect --format '{{.State.ExitCode}}' stopped-runner)" = 0
          test "$(( $(date +%s) - started ))" -lt 10

  quality:
    name: quality
    needs: [docs, ci, image]
    if: always()
    permissions:
      contents: read
      actions: read
    uses: overnightworks/quality/.github/workflows/gate.yml@2d2b68bf3916b34f6f2c72a540c1e3d8a947b750 # v0.10.0
    with:
      coverage-artifact: coverage
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
