name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    name: Documents
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Offline: only relative links and anchors in the tracked Markdown are
      # judged, so a dead external site never fails a pull request.
      - name: Check links and anchors
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          fail: true
          args: --offline --include-fragments --no-progress --verbose './**/*.md'

  quality:
    name: quality
    needs: [docs]
    if: always()
    permissions:
      contents: read
      actions: read
    uses: overnightworks/quality/.github/workflows/gate.yml@07bdf7c478ac9cc9cd348b180abd3cbc9d873f23 # v0.9.2
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
